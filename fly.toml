# Staging on Fly.io. Dummy people only: the roster folder is never built into the image.
app = "jb-people-staging"
primary_region = "sin"

[env]
  APP_ENV = "staging"
  APP_DEBUG = "false"
  APP_URL = "https://jb-people-staging.fly.dev"
  LOG_CHANNEL = "stderr"
  TRUSTED_PROXIES = "*"
  SESSION_SECURE_COOKIE = "true"
  QUEUE_CONNECTION = "sync"
  DB_DATABASE = "/var/www/html/database/data/database.sqlite"

[[mounts]]
  source = "people_data"
  destination = "/var/www/html/database/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
